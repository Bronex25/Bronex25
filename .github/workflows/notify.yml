name: Idealista notifier

on:
  schedule:
    # Every 15 min within a UTC window that brackets 09:00-21:00 Europe/Madrid
    # for both CET and CEST. The gate job below trims it to the exact local hours.
    - cron: "*/15 7-19 * * *"
  workflow_dispatch:

concurrency:
  group: idealista-notifier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - name: Check working hours (09:00-21:00 Europe/Madrid)
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run — bypassing working-hours gate."
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Europe/Madrid date +%-H)
          if (( hour >= 9 && hour < 21 )); then
            echo "Within working hours (${hour}:xx Europe/Madrid) — running."
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside 09:00-21:00 Europe/Madrid (${hour}:xx) — skipping."
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: gate
    if: needs.gate.outputs.active == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run notifier
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python idealista_notify.py

      - name: Commit notifier state if changed
        run: |
          if [[ -z "$(git status --porcelain -- seen.json processed_emails.json)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json processed_emails.json
          git commit -m "Update notifier state"
          # main can move between checkout and push (concurrent runs, PR merges).
          # Rebase onto the latest main and retry the push with backoff.
          for delay in 2 4 8 16; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push failed, retrying in ${delay}s"
            sleep "$delay"
          done
          echo "giving up after retries"
          exit 1
